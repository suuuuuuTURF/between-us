<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Join a Room — Between Us</title>

    <meta
        name="description"
        content="Join a private listening room on Between Us."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

</head>


<body>


    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            Between Us <span>♡</span>
        </a>


        <a
            href="how-it-works.html"
            class="nav-link"
        >
            How it works
        </a>

    </header>



    <!-- =================================================
         JOIN ROOM
    ================================================== -->

    <main class="create-page">

        <section class="create-card">


            <!-- HEADING -->

            <div class="create-heading">

                <p class="eyebrow">
                    SOMEONE IS WAITING
                </p>


                <h1>

                    Join a

                    <span>
                        room.
                    </span>

                </h1>


                <p>
                    Enter your name and the
                    room code they shared with you.
                </p>

            </div>



            <!-- =================================================
                 JOIN FORM
            ================================================== -->

            <form
                id="joinRoomForm"
                class="room-form"
            >


                <!-- YOUR NAME -->

                <div class="form-group">

                    <label for="joinUserName">
                        Your name
                    </label>


                    <input
                        type="text"
                        id="joinUserName"
                        name="joinUserName"
                        placeholder=" your name "
                        autocomplete="name"
                        maxlength="30"
                        required
                    >

                </div>



                <!-- ROOM CODE -->

                <div class="form-group">

                    <label for="joinRoomCode">
                        Room code
                    </label>


                    <input
                        type="text"
                        id="joinRoomCode"
                        name="joinRoomCode"
                        placeholder="e.g. ABC123"
                        maxlength="6"
                        minlength="6"
                        autocomplete="off"
                        autocapitalize="characters"
                        required
                    >

                </div>



                <!-- JOIN BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary create-button"
                >
                    Join Room
                </button>


            </form>



            <!-- STATUS -->

            <p
                id="joinConnectionStatus"
                class="form-status"
            >
                Connecting...
            </p>



            <!-- BACK -->

            <a
                href="index.html"
                class="back-link"
            >
                ← Back home
            </a>


        </section>

    </main>



    <!-- APP -->

    <script src="app.js"></script>

</body>

</html>
